<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 700" role="img" aria-labelledby="title desc">
<title id="title">Mill City Web Design neon sign over a stylized Minneapolis riverfront</title>
<desc id="desc">A dark illustrated Minneapolis scene with riverfront mills, the Stone Arch Bridge, skyline, and a warm neon Mill City Web Design sign.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#07111d"/>
    <stop offset=".52" stop-color="#142b3a"/>
    <stop offset=".82" stop-color="#633326"/>
    <stop offset="1" stop-color="#b65b35"/>
  </linearGradient>
  <linearGradient id="river" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#07131b"/>
    <stop offset="1" stop-color="#102c38"/>
  </linearGradient>
  <linearGradient id="brick" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#261b19"/>
    <stop offset="1" stop-color="#0e1012"/>
  </linearGradient>
  <filter id="orangeGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="7" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
  <pattern id="brickPattern" width="54" height="28" patternUnits="userSpaceOnUse">
    <path d="M0 0H54M0 28H54M0 14H54M27 0V14M13.5 14V28M40.5 14V28" fill="none" stroke="#6c3c2d" stroke-width="1" opacity=".28"/>
  </pattern>
</defs>

<!-- sky -->
<rect width="1600" height="700" fill="url(#sky)"/>
<ellipse cx="430" cy="515" rx="520" ry="110" fill="#ed7541" opacity=".12" filter="url(#softGlow)"/>
<circle cx="184" cy="111" r="22" fill="#ffd596" opacity=".9"/>
<circle cx="193" cy="103" r="22" fill="#07111d"/>

<!-- distant skyline -->
<g fill="#0b1117">
  <rect x="42" y="330" width="75" height="160"/><rect x="126" y="285" width="54" height="205"/>
  <rect x="191" y="315" width="92" height="175"/><rect x="294" y="245" width="62" height="245"/>
  <rect x="370" y="296" width="76" height="194"/><rect x="458" y="255" width="54" height="235"/>
  <rect x="520" y="336" width="78" height="154"/>
</g>
<g fill="#d9a55e" opacity=".55">
  <rect x="58" y="359" width="7" height="7"/><rect x="76" y="382" width="7" height="7"/><rect x="140" y="314" width="7" height="7"/>
  <rect x="214" y="340" width="8" height="8"/><rect x="240" y="365" width="8" height="8"/><rect x="310" y="274" width="8" height="8"/>
  <rect x="332" y="308" width="8" height="8"/><rect x="392" y="325" width="8" height="8"/><rect x="476" y="288" width="8" height="8"/>
  <rect x="542" y="359" width="8" height="8"/>
</g>

<!-- river -->
<path d="M0 490H1600V700H0Z" fill="url(#river)"/>
<path d="M0 558C300 520 500 548 720 574C930 598 1190 555 1600 536V700H0Z" fill="#0a1b24"/>
<g opacity=".34" stroke-linecap="round">
  <path d="M120 571h240" stroke="#ef7145" stroke-width="5"/>
  <path d="M250 600h290" stroke="#d5b46f" stroke-width="4"/>
  <path d="M630 625h350" stroke="#73d8ef" stroke-width="3"/>
</g>

<!-- Stone Arch inspired bridge -->
<g transform="translate(0 410)">
  <path d="M-30 145C170 90 420 92 710 146V191C420 146 170 147-30 198Z" fill="#211a17" stroke="#7f5a3d" stroke-width="3"/>
  <path d="M28 173Q95 104 162 167M168 166Q243 93 318 162M326 161Q406 83 486 160M495 161Q568 96 641 169"
        fill="none" stroke="#d58f4c" stroke-width="9" opacity=".88" filter="url(#orangeGlow)"/>
  <path d="M0 143C175 101 423 101 710 148" fill="none" stroke="#f3c16e" stroke-width="4"/>
</g>

<!-- mill building -->
<g transform="translate(680 178)">
  <path d="M0 150L75 100L148 128L148 60L245 12L340 83L420 54L520 122V450H0Z" fill="url(#brick)" stroke="#5a3b30" stroke-width="3"/>
  <path d="M0 150L75 100L148 128L148 60L245 12L340 83L420 54L520 122V450H0Z" fill="url(#brickPattern)" opacity=".72"/>
  <g fill="#d89b51" opacity=".76">
    <rect x="46" y="198" width="33" height="52"/><rect x="112" y="198" width="33" height="52"/>
    <rect x="184" y="198" width="33" height="52"/><rect x="250" y="198" width="33" height="52"/>
    <rect x="316" y="198" width="33" height="52"/><rect x="382" y="198" width="33" height="52"/>
    <rect x="448" y="198" width="33" height="52"/>
    <rect x="46" y="301" width="33" height="52"/><rect x="112" y="301" width="33" height="52"/>
    <rect x="184" y="301" width="33" height="52"/><rect x="250" y="301" width="33" height="52"/>
    <rect x="316" y="301" width="33" height="52"/><rect x="382" y="301" width="33" height="52"/>
    <rect x="448" y="301" width="33" height="52"/>
  </g>
</g>

<!-- sign support -->
<g stroke="#1c2024" stroke-width="10" opacity=".9">
  <path d="M845 224V95M1115 224V82M1375 248V117"/>
  <path d="M800 115H1455M816 169H1435"/>
</g>

<!-- main neon sign -->
<g transform="translate(782 95)">
  <rect x="0" y="0" width="700" height="330" rx="16" fill="#090d10" stroke="#222c31" stroke-width="8"/>
  <rect x="14" y="14" width="672" height="302" rx="10" fill="none" stroke="#73d8ef" stroke-width="4" opacity=".7" filter="url(#cyanGlow)"/>
  <rect x="28" y="28" width="644" height="274" rx="8" fill="none" stroke="#8d412d" stroke-width="3" opacity=".9"/>

  <!-- MC plaque -->
  <g transform="translate(292 -58)">
    <rect width="116" height="88" rx="10" fill="#0a1014" stroke="#73d8ef" stroke-width="5" filter="url(#cyanGlow)"/>
    <text x="58" y="61" text-anchor="middle" fill="#ffe7ad" stroke="#ff5a2f" stroke-width="2.5"
          font-family="Georgia,serif" font-size="48" font-weight="700" paint-order="stroke fill" filter="url(#orangeGlow)">MC</text>
  </g>

  <text x="350" y="150" text-anchor="middle"
        font-family="Georgia,serif" font-size="116" font-weight="700" letter-spacing="4"
        fill="#ffe7ad" stroke="#ff5a2f" stroke-width="5" paint-order="stroke fill"
        filter="url(#orangeGlow)">MILL CITY</text>

  <path d="M78 185H622" stroke="#8d412d" stroke-width="3"/>
  <text x="350" y="242" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-size="50" font-weight="700" letter-spacing="16"
        fill="#fff3cf" stroke="#f28a38" stroke-width="2" paint-order="stroke fill"
        filter="url(#orangeGlow)">WEB DESIGN</text>
  <text x="350" y="281" text-anchor="middle"
        font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="7"
        fill="#89e9fb" opacity=".9">MINNEAPOLIS · MINNESOTA</text>
</g>

<!-- foreground rail/details -->
<path d="M0 646C250 621 493 629 742 653C1012 679 1293 663 1600 623" fill="none" stroke="#19242a" stroke-width="18"/>
<path d="M0 637C250 612 493 620 742 644C1012 670 1293 654 1600 614" fill="none" stroke="#6c4c37" stroke-width="3"/>
</svg>